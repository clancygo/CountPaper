<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="blue" x1="128" y1="92" x2="900" y2="932" gradientUnits="userSpaceOnUse">
      <stop stop-color="#356FBA"/>
      <stop offset="1" stop-color="#173E78"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#07172D" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- CountPaper mark: an editor cursor and two balanced transaction markers. -->
  <rect x="62" y="62" width="900" height="900" rx="208" fill="url(#blue)"/>
  <rect x="88" y="88" width="848" height="848" rx="184" fill="none" stroke="#72A0D0" stroke-opacity=".55" stroke-width="8"/>
  <g filter="url(#shadow)">
    <!-- A monospaced editing cursor, never a document, wallet, or terminal prompt. -->
    <rect x="290" y="286" width="26" height="494" rx="13" fill="#FFFFFF"/>
    <!-- Plain-text ledger rows. -->
    <path d="M364 358h394M364 512h316M364 666h394" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>
    <path d="M364 738h394M364 770h394" fill="none" stroke="#0A1830" stroke-width="13" stroke-linecap="round" opacity=".82"/>
    <!-- Red and yellow signs are the two sides of a balanced entry, not generic status dots. -->
    <circle cx="434" cy="512" r="64" fill="#E6494F"/>
    <circle cx="658" cy="512" r="64" fill="#F2B63D"/>
    <path d="M404 512h60" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round"/>
    <path d="M628 512h60M658 482v60" stroke="#0A1830" stroke-width="17" stroke-linecap="round"/>
    <!-- Fine black baseline grounds the mark at small Dock sizes. -->
    <path d="M236 826h552" stroke="#0A1830" stroke-width="18" stroke-linecap="round" opacity=".72"/>
  </g>
</svg>
